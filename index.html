<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#101317" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Homenaje&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Sixtyfour+Convergence&display=swap"
    rel="stylesheet">
  <meta name="description" content="Terminal Applications by MattediWorks: browser ports of Console Adventure, RTSim, and the Terminal Engine project." />
  <link rel="canonical" href="https://terminal.mattediworks.com/" />
  <link rel="apple-touch-icon" href="/logo192.png" />
  <link rel="manifest" href="/manifest.json" />
  <script>
    (() => {
      const storageKey = 'terminal-applications-theme';
      const validThemes = ['light', 'dark', 'system'];
      let theme = 'system';

      try {
        const storedTheme = window.localStorage.getItem(storageKey);
        theme = validThemes.includes(storedTheme) ? storedTheme : 'system';
      } catch {
        theme = 'system';
      }

      const prefersDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches;
      const resolvedTheme = theme === 'system' ? (prefersDark ? 'dark' : 'light') : theme;
      const root = document.documentElement;

      root.dataset.theme = resolvedTheme;
      root.dataset.themePreference = theme;
      root.classList.add(resolvedTheme);
      root.style.colorScheme = resolvedTheme;
    })();
  </script>
  <title>Terminal Applications</title>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <script type="module" src="/src/index.jsx"></script>
</body>

</html>
