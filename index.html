<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" type="image/svg+xml" href="/mattediworks-icon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#101317" />
  <meta name="description" content="Terminal Applications by MattediWorks: browser ports of Console Adventure, RTSim, and the Terminal Engine project." />
  <link rel="canonical" href="https://terminal.mattediworks.com/" />
  <link rel="apple-touch-icon" href="/mattediworks-icon.svg" />
  <link rel="manifest" href="/manifest.json" />
  <script>
    (() => {
      const storageKey = 'terminal-applications-locale';
      const validLocales = ['en', 'pt-BR'];
      let locale = 'en';

      try {
        const storedLocale = window.localStorage.getItem(storageKey);
        if (validLocales.includes(storedLocale)) {
          locale = storedLocale;
        } else {
          const languages = navigator.languages?.length ? navigator.languages : [navigator.language];
          locale = languages.some((language) => language?.toLowerCase().startsWith('pt')) ? 'pt-BR' : 'en';
        }
      } catch {
        locale = 'en';
      }

      document.documentElement.lang = locale;
    })();
  </script>
  <script>
    (() => {
      const storageKey = 'terminal-applications-theme';
      const validThemes = ['light', 'dark', 'system'];
      let theme = 'system';

      try {
        const storedTheme = window.localStorage.getItem(storageKey);
        theme = validThemes.includes(storedTheme) ? storedTheme : 'system';
      } catch {
        theme = 'system';
      }

      const prefersDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches;
      const resolvedTheme = theme === 'system' ? (prefersDark ? 'dark' : 'light') : theme;
      const root = document.documentElement;

      root.dataset.theme = resolvedTheme;
      root.dataset.themePreference = theme;
      root.classList.add(resolvedTheme);
      root.style.colorScheme = resolvedTheme;
    })();
  </script>
  <title>Terminal Applications</title>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <script type="module" src="/src/index.jsx"></script>
</body>

</html>
