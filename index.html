  <meta property="og:site_name" content="Terminal Applications" />
  <meta property="og:title" content="Terminal Applications" />
  <meta
    property="og:description"
    content="MattediWorks browser-hosted terminal apps: Console Adventure, RTSim, and Terminal Engine runtime work."
  />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://terminal.mattediworks.com/" />

  <meta property="og:image:type" content="image/png" />

  <meta property="og:image:height" content="512" />

  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Terminal Applications" />

    name="twitter:description"
    content="Browser-hosted terminal apps from MattediWorks, powered by React and xterm.js."
  />
  <meta name="twitter:image" content="https://terminal.mattediworks.com/logo512.png" />
  <meta name="twitter:image:alt" content="MattediWorks logo for Terminal Applications" />
  <script>
    (() => {
      const storageKey = 'terminal-applications-locale';
      const validLocales = ['en', 'pt-BR'];
      let locale = 'en';

      try {
        const storedLocale = window.localStorage.getItem(storageKey);
        if (validLocales.includes(storedLocale)) {
          locale = storedLocale;
        } else {
          const languages = navigator.languages?.length ? navigator.languages : [navigator.language];
          locale = languages.some((language) => language?.toLowerCase().startsWith('pt')) ? 'pt-BR' : 'en';
        }
      } catch {
        locale = 'en';
      }

      document.documentElement.lang = locale;
    })();
  </script>
  <script>
    (() => {
      const storageKey = 'terminal-applications-theme';
      const validThemes = ['light', 'dark', 'system'];
      let theme = 'system';

      try {
        const storedTheme = window.localStorage.getItem(storageKey);
        theme = validThemes.includes(storedTheme) ? storedTheme : 'system';
      } catch {
        theme = 'system';
      }

      const prefersDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches;
      const resolvedTheme = theme === 'system' ? (prefersDark ? 'dark' : 'light') : theme;
      const root = document.documentElement;

      root.dataset.theme = resolvedTheme;
      root.dataset.themePreference = theme;
      root.classList.add(resolvedTheme);
      root.style.colorScheme = resolvedTheme;
    })();
  </script>
  <title>Terminal Applications</title>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <script type="module" src="/src/index.jsx"></script>
</body>

</html>
